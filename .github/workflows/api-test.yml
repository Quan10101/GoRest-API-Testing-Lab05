
name: GoRest API CI Pipeline

on:
  push:
  workflow_dispatch:

jobs:
  api-testing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Postman API Tests
        env:
          GOREST_TOKEN: ${{ secrets.GOREST_TOKEN }}
        run: |
          newman run "2474802010333_VoHoangQuan_GoRest.postman_collection.json" \
            -e "2474802010333_VoHoangQuan_GoRest_Env.postman_environment.json" \
            -d users.csv \
            --env-var "token=$GOREST_TOKEN"
